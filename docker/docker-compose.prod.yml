version: '3.8'

# Production Docker Compose for Ubuntu Server deployment

services:
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: trilium-weaviate
    restart: always
    ports:
      - "8601:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'  # Disable for production
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: '${WEAVIATE_API_KEY}'
      AUTHENTICATION_APIKEY_USERS: 'trilium-user'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-openai,text2vec-huggingface,generative-openai'
      CLUSTER_HOSTNAME: 'node1'
      # Resource limits for production
      GOGC: '100'
      GOMEMLIMIT: '2GiB'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - trilium-ai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8601/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  weaviate_data:
    driver: local

networks:
  trilium-ai-network:
    driver: bridge
